        selector: "main"
        anchors: ["referral"]
        note: "Rozhodne rozpor mezi 1% cashbackem a 50 GBP — prioritní zdroj k ověření."

  - record_id: skip-pay__doporucte-nas
    subject: Skip Pay
    sources:
      - url: https://skippay.cz/doporucte-nas
        type: html
        selector: "main"
        anchors: ["doporuč", "Kč"]
        note: "Stránka programu."
      - url: https://skippay.cz/caste-dotazy/dalsi-caste-otazky/kolik-muzu-za-doporuceni-celkem-ziskat
        type: html
        selector: "main"
        anchors: ["doporuč"]
        note: "FAQ s limitem odměny."

  - record_id: twisto__promo-kody
    subject: Twisto
    sources:
      - url: https://www.twisto.cz/vychytavky/twistoucet/
        type: html
        selector: "main"
        anchors: []
        note: "Twisto nemá veřejnou stránku programu — promo kódy nejsou plošné. Sledujeme produktovou stránku."

  - record_id: komercni-banka__zadny-mgm
    subject: Komerční banka
    sources:
      - url: https://www.kb.cz/cs/obcane/bonus-az-4-000-kc-pro-nove-klienty
